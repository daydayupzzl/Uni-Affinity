# The `data` block points at the bundled smoke test; see README.md for training on PDBbind.
experiment:
  name: uniaffinity_pdbbind
  seed: 0
  output_dir: runs
  tag: null
  run_dir: null
  snapshot_code: true

data:
  root: smoke
  index_root: smoke
  structure_fallback_roots: [smoke]
  csv: index.csv
  split_file: smoke/split.csv
  cache_dir: smoke/cache
  label_column: pK
  structure_column: pocket_pdb
  ligand_column: ligand_sdf
  ligand_fallback_column: ligand_mol2
  num_workers: 4
  on_error: skip            # skip | raise

graph:
  pocket_cutoff: 10.0
  max_protein_nodes: 1024
  protein_cutoff: 10.0
  protein_max_neighbors: 32
  ligand_spatial_cutoff: 4.5
  ligand_max_neighbors: 12
  ligand_rbf_cutoff: 5.0
  inter_cutoff: 8.0
  inter_max_neighbors: 32
  residue_contact_margin: 8.0
  rbf_bins: 16
  hbond_cutoff: 3.5         # interaction fingerprint, Angstrom
  hydrophobic_cutoff: 4.0
  salt_bridge_cutoff: 4.0
  metal_cutoff: 2.8
  pi_stack_cutoff: 5.5
  cation_pi_cutoff: 6.0

pretrained:
  esm:
    enabled: true
    cache_dir: cache/esm2_650m
    dimension: 1280
  unimol:
    enabled: true
    cache_dir: cache/unimol
    dimension: 512

model:
  scalar_dim: 128
  vector_dim: 16
  input_vector_channels: 4
  rbf_dim: 32
  protein_intra_layers: 3
  ligand_intra_layers: 3
  inter_layers: 3
  dropout: 0.1
  coord_noise: 0.2          # training only
  contact_dropout: 0.1

loss:
  huber_weight: 1.0
  huber_delta: 1.0
  relative_weight: 0.2
  pearson_weight: 0.1

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  grad_clip: 5.0
  patience: 20
  monitor: rmse
  monitor_mode: min
  warmup_epochs: 3
  min_lr_ratio: 0.01
  device: auto
